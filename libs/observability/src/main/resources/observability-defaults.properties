# 모든 서비스에 들어가는 라이브러리 기본 속성(design 결정 2). 속성 소스 맨 뒤에 붙어 서비스의 application.yml과 환경 변수가 이긴다.
# OTLP 내보내기 주소(management.opentelemetry.tracing.export.otlp.endpoint)는 두지 않는다. 주소가 없으면 스팬을 내보내지 않는다.

# 로컬 실험에서 모든 요청을 본다(아키텍처 7-1). Boot 기본값은 0.1
management.tracing.sampling.probability=1.0

# applicationTaskExecutor에 ContextPropagatingTaskDecorator를 붙여 풀 스레드에서도 traceId를 잇는다(design 결정 4). Boot 기본값은 false.
# 끄면 끊긴다는 기록은 feed-service의 FeedTracePropagationOffTest에 있다.
spring.task.execution.propagate-context=true

# Prometheus가 긁어 갈 수 있게 연다(design 결정 7). 서비스 application.yml에는 이 속성을 두지 않는다. 두면 서비스 값이 이겨 prometheus가 닫힌다.
management.endpoints.web.exposure.include=health,info,prometheus
