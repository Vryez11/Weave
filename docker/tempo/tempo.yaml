# 단일 프로세스, 파일 저장소 Tempo (add-trace-logging design 결정 7).
# 스팬은 Alloy가 OTLP gRPC(4317)로 넘긴다. 컨테이너를 지우면 트레이스도 지워진다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

usage_report:
  reporting_enabled: false
