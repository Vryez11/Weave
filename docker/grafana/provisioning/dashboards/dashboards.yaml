# Grafana 대시보드 공급자 (add-fault-experiments design 결정 11, 아키텍처 7-4).
# compose.yaml이 docker/grafana/dashboards를 /etc/grafana/dashboards에 마운트하고, 그 폴더의 JSON을 띄울 때 불러온다.
# 대시보드는 파일이 기준이라 화면에서 고친 내용은 저장하지 않는다. 고칠 때는 JSON을 고친다.
apiVersion: 1

providers:
  - name: weave
    type: file
    folder: weave
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
