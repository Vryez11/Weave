spring:
  application:
    name: feed-service
  http:
    serviceclient:
      post:
        base-url: ${POST_BASE_URL:http://localhost:8081}
      user:
        base-url: ${USER_BASE_URL:http://localhost:8082}
      like:
        base-url: ${LIKE_BASE_URL:http://localhost:8083}
      recommendation:
        base-url: ${RECOMMENDATION_BASE_URL:http://localhost:8084}
      ad:
        base-url: ${AD_BASE_URL:http://localhost:8085}
  task:
    execution:
      pool:
        # 200 RPS × 호출 5번 × 50ms = 동시 50개, 여유 2배 (design 결정 8). 대기열은 기본값(무제한)
        core-size: 100

weave:
  http-client:
    # 200 RPS × 50ms = 동시 10개, 여유 2배 (design 결정 8)
    max-connections-per-route: 20

server:
  port: 8080
  tomcat:
    # Tomcat 스레드 지표(tomcat_threads_busy_threads)를 내보낸다 (add-fault-experiments design 결정 4)
    mbeanregistry:
      enabled: true

management:
  metrics:
    distribution:
      # 피드 요청과 의존성별 호출 지연의 p99를 Prometheus에서 계산한다 (add-fault-experiments design 결정 4)
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
