spring:
  application:
    name: feed-service
  jackson:
    # 본문의 version·liked를 소수 버림이나 문자열 변환으로 받아들이지 않고 400으로 돌려준다 (post-like 스펙 "본문이 잘못됐다")
    deserialization: { accept-float-as-int: false }
    mapper: { allow-coercion-of-scalars: false }
  data:
    redis:
      # post stale 캐시 저장소. Compose는 REDIS_HOST=redis를 준다 (add-graceful-degradation design 결정 14)
      host: ${REDIS_HOST:localhost}
      # 캐시 읽기 상한(명령 타임아웃)과 연결 타임아웃. 예산 250ms = post 상한 100 + 읽기 + user·like 상한 100 + 집계 20에서 읽기 ≤ 30ms.
      # S-06(400 RPS, 모든 요청이 캐시를 읽는다, 20261107-130950-S-06)에서 GET 120,003건의 99.90%가 1.05ms 이하, 모두 9.79ms 이하라
      # 상한의 1/3(10ms) 기준 안이다. 연결이 끊기면 REJECT_COMMANDS로 바로 실패한다 (add-graceful-degradation design 결정 4, 6)
      timeout: 30ms
      connect-timeout: 30ms
  http:
    # 연결·응답 타임아웃은 그 의존성의 호출 시간 상한(resilience4j.timelimiter)과 같다. 상한이 future를 끝내도 블로킹 I/O를 하던
    # 스레드는 풀리지 않아, 스레드와 커넥션을 놓는 시점을 HttpClient가 정한다 (add-call-isolation design 결정 3)
    serviceclient:
      post:
        base-url: ${POST_BASE_URL:http://localhost:8081}
        connect-timeout: 100ms
        read-timeout: 100ms
      user:
        base-url: ${USER_BASE_URL:http://localhost:8082}
        connect-timeout: 100ms
        read-timeout: 100ms
      like:
        base-url: ${LIKE_BASE_URL:http://localhost:8083}
        connect-timeout: 100ms
        # 좋아요 상태 변경도 이 값을 쓴다. MVP 토글의 무부하 p99 약 60ms, 100ms 초과 1,000건 중 0~1건 (design 결정 6)
        read-timeout: 100ms
      recommendation:
        base-url: ${RECOMMENDATION_BASE_URL:http://localhost:8084}
        connect-timeout: 200ms
        read-timeout: 200ms
      ad:
        base-url: ${AD_BASE_URL:http://localhost:8085}
        connect-timeout: 200ms
        read-timeout: 200ms

# 하위 서비스 호출 격리 (add-call-isolation design 결정 1, 5, 7). 인스턴스 이름은 HTTP 서비스 그룹 이름과 같고 IsolatedCalls가 꺼내 쓴다.
# 여기에는 구조만 둔다. 값(상한, 벌크헤드 크기, 서킷 문턱)은 근거와 함께 따로 넣는다(design 결정 12)
resilience4j:
  circuitbreaker:
    configs:
      default:
        # 최근 10초로 판단한다. 호출 100개(400 RPS에서 0.25초) 창은 like-service의 1.05초 GC 멈춤만으로 차서 서킷이 5초 열렸다.
        # 10초면 1초 멈춤은 창의 약 10%라 문턱에 못 미친다. 대신 계속 실패하는 장애도 창 전체의 실패율이 문턱을 넘어야 열려,
        # 평시 뒤의 장애는 빨리 실패하면 약 5초, 무응답이면 약 6.7초 뒤에 연다(S-03 실측 7~12초). 최근 10초의 호출이 100개가 되기 전
        # (시작 직후 JIT 준비 등)에는 열지 않는다 (design 결정 7, 16)
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 100
        # 기준선 S-01의 의존성별 호출 실패율은 0이다. 평시에 열릴 일이 없고 S-05(like 에러율 50%)는 문턱 근처에서 열렸다 닫혔다 한다
        failure-rate-threshold: 50
        # 상한에 걸리기 전에 느려지는 중을 잡는다. 평시에 경계(67.11ms·156.59ms 버킷)를 넘는 비율은 0.17% 이하다. 상한마다 80%라
        # 인스턴스에서 값을 준다 (design 결정 3, 7)
        slow-call-rate-threshold: 50
        # S-08 복구 시간 목표 20초(기준선 40초의 절반)에서 거꾸로 정했다. 거둔 뒤 최대 5초 열려 있고 시험 호출이 바로 이어져,
        # 거둔 뒤 첫 10초 구간 안에 닫힌다. 열린 동안 죽은 서비스로 가는 호출은 5초에 시험 호출 10개뿐이다
        wait-duration-in-open-state: 5s
        # 400 RPS에서 25ms 분량이라 복구를 늦추지 않으면서, 문턱 50%를 다섯 번 이상의 실패로 판단한다
        permitted-number-of-calls-in-half-open-state: 10
        # 요청이 없어도 열림 유지 시간이 지나면 반열림이 된다 (call-isolation "복구하면 서킷이 닫힌다")
        automatic-transition-from-open-to-half-open-enabled: true
        # 실패 로그의 cause와 같은 분류로 센다: 상한·응답 타임아웃, 연결 실패, 입출력 실패, 5xx (design 결정 7)
        record-failure-predicate: com.weave.feed.gateway.CircuitFailurePredicate
        # 벌크헤드 거절과 요청 수 상한(ad)이 막은 호출은 하위 서비스를 부르지 않았으므로 성공으로도 세지 않는다. 세면 거절이 실패율을
        # 묽힌다 (design 결정 5, 7, add-retry-policy design 결정 6)
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
    instances:
      post: { base-config: default, slow-call-duration-threshold: 80ms }
      user: { base-config: default, slow-call-duration-threshold: 80ms }
      like: { base-config: default, slow-call-duration-threshold: 80ms }
      recommendation: { base-config: default, slow-call-duration-threshold: 160ms }
      ad: { base-config: default, slow-call-duration-threshold: 160ms }
  timelimiter:
    configs:
      default:
        # Resilience4j 기본값과 같다. CompletionStage 경로는 상한이 지나면 future를 끝내기만 하고 취소하지 않아 효과가 없다.
        # 상한이 지난 호출이 스레드·커넥션을 놓는 시점은 응답 타임아웃(read-timeout)이 정한다 (design 결정 3)
        cancel-running-future: true
    # 호출 시간 상한. 기준선 S-01의 평시 호출 p99(51.0~53.7ms)의 약 2배(아키텍처 4-3). 평시에 100ms 경계(89.48ms)를 넘는 비율은
    # post 0.0119%, user 0.0076%, like 0.0136%로 합 0.033%(가용성 예산의 절반 0.05% 아래), 200ms 경계(178.96ms)는 0 (design 결정 3)
    instances:
      post: { base-config: default, timeout-duration: 100ms }
      user: { base-config: default, timeout-duration: 100ms }
      like: { base-config: default, timeout-duration: 100ms }
      # 선택 등급. ①+②가 끝날 때까지만 기다리면 된다
      recommendation: { base-config: default, timeout-duration: 200ms }
      ad: { base-config: default, timeout-duration: 200ms }
  thread-pool-bulkhead:
    configs:
      default:
        # 의존성마다 스레드 40. 리틀의 법칙: 실험 400 RPS × 평시 호출 p99 51ms ≈ 20.4, 여유 2배 ≈ 41 → 40. 기준선 400 RPS의
        # 의존성별 커넥션 사용 중 최댓값 14~16의 2.5배 이상이다 (아키텍처 5-6, design 결정 5)
        core-thread-pool-size: 40
        max-thread-pool-size: 40
        # 자리가 없으면 기다리지 않고 바로 거절한다 (아키텍처 5-6, design 결정 5)
        queue-capacity: 0
        # 벌크헤드 스레드에 요청의 관찰·MDC를 넘겨 traceId가 이어지게 한다 (design 결정 8, 아키텍처 7-3)
        context-propagators: com.weave.feed.gateway.TraceContextPropagator
    instances:
      post: { base-config: default }
      user: { base-config: default }
      like: { base-config: default }
      recommendation: { base-config: default }
      ad: { base-config: default }
  bulkhead:
    configs:
      default:
        # Semaphore 모드의 조회 상한. 비교하려는 것은 격리 방식이라 ThreadPool 벌크헤드와 같은 40을 쓴다 (design 결정 11)
        max-concurrent-calls: 40
        # 자리가 없으면 기다리지 않고 바로 거절한다 (design 결정 6)
        max-wait-duration: 0
    instances:
      # 좋아요 상태 변경. 요청 스레드에서 동기로 부르고 like 서킷을 같이 쓴다. 동시 10은 like 커넥션 풀에서 읽기 몫(40) 밖에 둔 자리다.
      # S-11(400 RPS, 앱 지연 없는 직접 호출의 막히지 않은 p99 11ms)의 리틀의 법칙: 400 × 0.011 = 4.4, 여유 2배로 약 9라 10을 유지한다.
      # 조회 상한처럼 p99 51ms를 전제하면 약 20이다. feed-service를 거친 쓰기 부하는 재지 않았다 (docs/experiments/idempotent-like.md)
      like-write: { base-config: default, max-concurrent-calls: 10 }
      # Semaphore 모드(weave.isolation.bulkhead-type: semaphore)에서 조회를 감싼다 (design 결정 11)
      post: { base-config: default }
      user: { base-config: default }
      like: { base-config: default }
      recommendation: { base-config: default }
      ad: { base-config: default }
  # 멱등한 조회의 재시도 (add-retry-policy design 결정 1, 2). IsolatedCalls가 설정(최대 시도 횟수, 간격 함수)만 꺼내 쓰고 재시도 루프는
  # 직접 돈다. ad(외부 API)는 인스턴스를 두지 않아 다시 부르지 않는다. 좋아요 상태 변경은 이 설정과 관계없이 다시 부르지 않는다
  retry:
    configs:
      default:
        # 요청 하나에 최대 3번(Google SRE 책 22장). user·like가 post 중앙값(20ms) 뒤 시작해 빠른 실패(중앙값 20ms)를 두 번 겪어도
        # 세 번째 시도의 상한(100ms)까지 약 190ms라 예산 250ms 안이다. 느린 경우는 "남은 예산 ≥ 상한 + 기다림" 조건이 막는다
        # (add-retry-policy design 결정 3, 11)
        max-attempts: 3
        # 10ms, 20ms(×2)를 ±50% 펼쳐 기다린다. 기다림 합(최대 45ms)이 하위 서비스 평시 중앙값(20ms) 두 번 남짓이라 남은 예산을 시도
        # 자체에 쓴다. 요청 안의 재시도는 순간 실패만 넘기고, 몇 초짜리 장애는 서킷(열림 5초)과 대체가 맡는다. jitter는 같은 순간 실패한
        # 요청(400 RPS에서 10ms에 4건, 장애 시작이면 수백 건)이 같은 순간 다시 몰리지 않게 한다 (design 결정 11)
        wait-duration: 10ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
    instances:
      post: { base-config: default }
      user: { base-config: default }
      like: { base-config: default }
      recommendation: { base-config: default }
  # ad(외부 API)의 요청 수 상한. 계약 쿼터를 넘기 전에 feed-service가 먼저 멈춘다 (add-retry-policy design 결정 6). IsolatedCalls가
  # 인스턴스가 있는 의존성만 서킷 안, 시간 상한 바깥에서 감싼다
  ratelimiter:
    configs:
      default:
        # 허용을 기다리지 않는다. ad 호출은 요청 스레드에서 시작하므로 기다리면 요청 스레드가 묶인다 (design 결정 6). 주기와 주기당 한도는
        # 인스턴스마다 둔다. 인스턴스에 값이 없으면 Resilience4j 기본값(500ns마다 50)이라 사실상 막지 않는다
        timeout-duration: 0
    instances:
      # ad 계약 쿼터(가정, PRD 3장): 인스턴스당 초당 600건, 1초 고정 창. 제공자의 1초 창에는 이 RateLimiter의 100ms 주기가 최대 11개
      # 걸치므로 54 × 11 = 594 ≤ 600. 평균 초당 540건은 실험 피크 400 RPS의 1.35배이고, 주기마다 수요 40건에 54건이라 GC 멈춤 뒤
      # 몰린 요청 14건까지 막지 않는다. 주기 1초(한도 300)는 피크를 받지 못한다 (add-retry-policy design 결정 6, 11)
      ad: { base-config: default, limit-refresh-period: 100ms, limit-for-period: 54 }

weave:
  # 재시도 예산(add-retry-policy design 결정 5, 10, 11). 의존성마다 최근 1초 원래 호출 수의 10%와 최솟값 중 큰 값까지만 다시 부른다
  retry:
    budget:
      # PRD 10장의 요청 배율 상한(재시도로 늘어나는 하위 요청 20%)의 절반(Google SRE 책의 클라이언트 재시도 예산 10%). S-09 계산에서
      # 예산이 있으면 20초 구간 배율 약 1.03(창 1초), 없으면 약 1.33이라 수집 간격·칸 오차를 넣어도 상한 1.2와 갈린다 (design 결정 10)
      ratio: 0.1
      # 장애가 시작되는 순간 풀리는 재시도는 창에 쌓인 예산 전부다. 400 RPS에서 40번으로 100ms 칸 하나의 평시 호출 수와 같다.
      # 10초 창에서는 S-09 장애 시작에 재시도가 0.5초 안에 약 120~320번 몰린 직후 feed-service가 0.2~0.7초 멈추고 503이 났다 (design 결정 5)
      window: 1s
      # 트래픽이 적을 때(초당 10건 미만)만 쓰인다. 창마다 1건(초당 1건)은 하위 서비스 처리량(400 RPS)의 0.25%다
      min-retries: 1
  # 429의 Retry-After 대기(add-retry-policy design 결정 4, 11). 대기 중인 의존성은 부르지 않고 retry_after로 바로 대체한다
  retry-after:
    # Retry-After가 없거나 읽지 못한 429는 쿼터 창 하나(계약 1초 창)만 쉰다
    default-hold: 1s
    # 이보다 긴 Retry-After는 쿼터 창이 아니라 일일 한도 소진이나 제공자 장애다. 1분마다 한 번 확인하는 비용(분당 요청 1건)이 광고를
    # 오래 잃는 비용보다 작다고 본다. 측정이 아니라 판단이고 change 승인 때 확인했다(2026-11-08)
    max-hold: 60s
  # post stale 캐시(Redis). post가 성공할 때마다 마지막 정상 응답을 size별로 남기고, 실패하면 허용 시간 안의 것으로 stale 응답한다
  # (add-graceful-degradation design 결정 4, 5)
  post-cache:
    # PRD 3장·10장: 짧은 장애(배포 실패, 재시작)는 가리고, 복구 뒤 오래된 피드가 길게 남지 않게 한다. Redis TTL도 같다
    max-staleness: 10m
    # 같은 키는 1초에 한 번만 쓴다. 400 RPS에서 매번 쓰면 같은 값(약 6KB)을 초당 400번 덮어쓴다. 1초면 cachedAt이 마지막 정상 응답보다
    # 최대 1초 이르고, 허용 시간 10분의 0.17%라 판단에 영향이 없다
    write-interval: 1s
  # user 로컬 캐시. user가 실패했을 때만 읽고, 성공할 때마다 받은 프로필을 넣는다 (add-graceful-degradation design 결정 7)
  user-cache:
    # 정상 동안은 피드의 작성자가 요청마다 다시 쓰여 늘 새것이라, 이 값은 user-service가 죽은 뒤 작성자를 채울 수 있는 시간과
    # 장애 중에 보이는 프로필의 최대 나이를 정한다. post stale 허용 10분보다 충분히 길게(6배) 둬 post와 user가 함께 아플 때 user가
    # 먼저 바닥나지 않게 한다. 측정이 아니라 판단이고 change 승인 때 확인했다
    expire-after-write: 1h
    # 항목 하나 약 320~336B(실험 데이터 모양의 프로필 1만 개를 넣은 힙 차이, tasks 4.2)라 1만 개에 약 3.2MB, 최대 힙(1GB 컨테이너의
    # 25%, 256MB)의 1.3%다. 피드 하나의 작성자는 최대 50명이라 최근 피드 작성자를 넉넉히 덮는다
    maximum-size: 10000
  feed:
    # 피드 요청 하나의 시간 예산. p99 300ms(PRD 2장)에 여유 50ms. post 100ms + user·like 100ms = 200ms라 예산이 먼저 끝나는 것은
    # 벌크헤드 대기나 스레드 전환 지연이 쌓일 때뿐이다 (아키텍처 4-3, design 결정 4)
    time-budget: 250ms
  isolation:
    # thread-pool(기본) | semaphore. semaphore면 조회를 applicationTaskExecutor에서 돌리고 Semaphore 벌크헤드로 감싼다.
    # 가상 스레드 비교 실험에서만 spring.threads.virtual.enabled: true와 함께 바꾼다 (design 결정 11)
    bulkhead-type: thread-pool
  http-client:
    # 의존성별 벌크헤드 크기(40)와 같게 둬 커넥션을 기다리는 일이 없게 한다. 기다림은 벌크헤드 한 곳에서만 일어난다 (design 결정 5)
    max-connections-per-route: 40
    groups:
      # 읽기 벌크헤드 40 + 쓰기 상한 10 (design 결정 5, 6)
      like:
        max-connections: 50
    # 벌크헤드 크기 ≤ 커넥션 풀이라 평시에는 기다리지 않는다. 기다린다면 설정 오류라 가장 짧은 상한으로 빨리 실패한다 (design 결정 3)
    connection-request-timeout: 100ms

server:
  port: 8080
  tomcat:
    threads:
      # Boot 기본값 그대로. 기준선이 이 값에서 재졌다는 것을 보이게 명시한다 (add-fault-experiments design 결정 10, 아키텍처 4-2)
      max: 200
    # Tomcat 스레드 지표(tomcat_threads_busy_threads)를 내보낸다 (add-fault-experiments design 결정 4)
    mbeanregistry:
      enabled: true

management:
  health:
    # post stale 캐시 저장소(Redis)는 선택적 대체 수단이라 feed-service 헬스(Compose healthcheck, run.sh의 대기)를 내리지 않는다.
    # Redis가 죽어도 post-service가 정상이면 피드는 정상이다 (add-graceful-degradation design 결정 4)
    redis:
      enabled: false
  metrics:
    distribution:
      # 피드 요청과 의존성별 호출 지연의 p99를 Prometheus에서 계산한다 (add-fault-experiments design 결정 4)
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        # post stale 캐시(Redis) 명령 지연. S-06에서 캐시 읽기 p99로 읽기 상한(spring.data.redis.timeout)의 근거를 잰다
        # (add-graceful-degradation design 결정 6)
        lettuce: true
